name: "Release Multi-Platform"
name: "Release Multi-Platform"

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

env:
  FFMPEG_VERSION: "7.1"

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            args: ""
            ffmpeg_url: "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-7.1.zip"
            ffmpeg_bin: "ffmpeg.exe"
            sidecar_name: "ffmpeg-x86_64-pc-windows-msvc.exe"
          # Linux x86_64
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            args: ""
            ffmpeg_url: "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-linux64-gpl-7.1.tar.xz"
            ffmpeg_bin: "ffmpeg"
            sidecar_name: "ffmpeg-x86_64-unknown-linux-gnu"
          # macOS Apple Silicon (M1/M2/M3/M4)
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
            ffmpeg_url: ""
            ffmpeg_bin: "ffmpeg"
            sidecar_name: "ffmpeg-aarch64-apple-darwin"
          # macOS Intel
          - platform: "macos-13"
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
            ffmpeg_url: ""
            ffmpeg_bin: "ffmpeg"
            sidecar_name: "ffmpeg-x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # --- FFmpeg Sidecar Download ---

      - name: Download FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "${{ matrix.ffmpeg_url }}" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extracted
          $bin = Get-ChildItem -Recurse -Filter "ffmpeg.exe" -Path ffmpeg-extracted | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path src-tauri/bin
          Copy-Item $bin.FullName "src-tauri/bin/${{ matrix.sidecar_name }}"

      - name: Download FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q "${{ matrix.ffmpeg_url }}" -O ffmpeg.tar.xz
          tar xf ffmpeg.tar.xz
          mkdir -p src-tauri/bin
          find . -name "ffmpeg" -type f -executable | head -1 | xargs -I{} cp {} "src-tauri/bin/${{ matrix.sidecar_name }}"
          chmod +x "src-tauri/bin/${{ matrix.sidecar_name }}"

      - name: Install FFmpeg via Homebrew (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          mkdir -p src-tauri/bin
          cp "$(which ffmpeg)" "src-tauri/bin/${{ matrix.sidecar_name }}"

      # --- System Dependencies ---

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # --- Build ---

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Kreatif Multimedia Studio v__VERSION__"
          releaseBody: |
            ## Rilis Otomatis

            Installer tersedia untuk:
            - **Windows**: `.msi` / `.exe`
            - **Linux**: `.deb` / `.AppImage`
            - **macOS Apple Silicon**: `.dmg`
            - **macOS Intel**: `.dmg`

            ### Catatan
            - FFmpeg sudah disertakan di dalam installer (tidak perlu install terpisah).
            - Lihat [CHANGELOG](./CHANGELOG.md) untuk daftar perubahan.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
