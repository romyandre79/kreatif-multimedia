[package]
name = "kreatif-multimedia"
version = "1.0.0"
description = "Desktop Video Editor & AI Storyboard Studio"
authors = ["Kreatif Multimedia Team"]
edition = "2021"

[lib]
name = "kreatif_multimedia_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
